<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <styLe>
        body#cartbody {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f9f9f9;
            margin: 0;
            padding: 30px;
            text-align: center;
        }

        #carttable {
            width: 80%;
            margin: auto;
            border-collapse: collapse;
            background-color: #ffffff;
            box-shadow: 0 0 12px rgba(0, 0, 0, 0.1);
        }

        #carttable th,
        #carttable td {
            padding: 12px 16px;
            border: 1px solid #ccc;
            text-align: center;
            font-size: 16px;
        }

        #carttable thead {
            background-color: #0d6efd;
            color: white;
        }

        #carttable tbody tr:nth-child(even) {
            background-color: #f2f2f2;
        }

        #carttable tfoot {
            background-color: #e8f0fe;
            font-weight: bold;
        }

        #carttable tfoot td {
            color: #333;
        }
    </styLe>
</head>

<body id="cartbody">
    <center>
        <h2>Your Shopping Cart</h2>
        <table id="carttable" border="1">
            <thead>
                <tr>
                    <th>Book Name</th>
                    <th>Price</th>
                    <th>Quantity</th>
                    <th>Amount</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td>Java 2</td>
                    <td>$35.5</td>
                    <td>2</td>
                    <td>$71.00</td>
                </tr>
                <tr>
                    <td>XML Bible</td>
                    <td>$40.5</td>
                    <td>1</td>
                    <td>$40.5</td>
                </tr>
            </tbody>
            <tfoot>
                <tr>
                    <td colspan="3" style="text-align: right;"><strong>Total Amount</strong></td>
                    <td><strong>$111.50</strong></td>
                </tr>
            </tfoot>
        </table>
    </center>
</body>

</html>
