<!DOCTYPE html>
<html>

<head>
  <title>Registration Form</title>
  <style>
    /* Reset some default styles */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background: linear-gradient(to right, #1f1c2c, #928dab);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      color: #fff;
      padding: 20px;
    }

    main {
      width: 100%;
      max-width: 700px;
      background-color: rgba(0, 0, 0, 0.7);
      padding: 40px;
      border-radius: 12px;
      box-shadow: 0 0 20px rgba(0, 255, 200, 0.2);
    }

    h1 {
      text-align: center;
      margin-bottom: 30px;
      color: #00ffe7;
      font-size: 28px;
    }

    .form-group,
    fieldset.form-group {
      margin-bottom: 20px;
    }

    label {
      display: block;
      margin-bottom: 8px;
      font-size: 15px;
      color: #e0e0e0;
    }

    input[type="text"],
    input[type="email"],
    input[type="password"],
    input[type="tel"],
    input[type="date"],
    textarea {
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 6px;
      background-color: #333;
      color: #fff;
      font-size: 15px;
    }

    input[type="text"]:focus,
    input[type="email"]:focus,
    input[type="password"]:focus,
    input[type="tel"]:focus,
    input[type="date"]:focus,
    textarea:focus {
      outline: none;
      border: 2px solid #00ffe7;
    }

    textarea {
      resize: vertical;
    }

    span {
      display: inline-block;
      margin-right: 15px;
      margin-top: 8px;
      color: #ccc;
    }

    fieldset.form-group {
      border: 1px solid #00ffe7;
      padding: 15px;
      border-radius: 8px;
    }

    legend {
      padding: 0 10px;
      font-weight: bold;
      color: #00ffe7;
    }

    button {
      width: 100%;
      padding: 12px;
      background-color: #00ffe7;
      color: #000;
      font-weight: bold;
      border: none;
      border-radius: 6px;
      font-size: 16px;
      cursor: pointer;
      transition: background 0.3s ease;
      margin-top: 15px;
    }

    button:hover {
      background-color: #00d1c2;
    }

    #nameError,
    #emailError,
    #passwordError,
    #phoneError {
      color: #ff6b6b;
      font-size: 13px;
      margin-top: 4px;
    }
  </style>
</head>

<body>
  <main>
    <section class="form-section">

      <legend>
        <h1>Registration Form</h1>
      </legend>
      <div class="form-group">
        <label for="name">Name</label>
        <input type="text" id="name" name="name" placeholder="Enter Name">
        <div id="nameError"></div>
      </div>
      <div class="form-group">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" placeholder="Enter Email">
        <div id="emailError"></div>
      </div>
      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" placeholder="Enter Password">
        <div id="passwordError"></div>
      </div>
      <div class="form-group">
        <label for="phone">Phone</label>
        <input type="tel" id="phone" name="phone" placeholder="Enter Phone Number">
        <div id="phoneError"></div>
      </div>
      <div class="form-group">
        <label for="gender">Gender</label>
        <span>
          <label for="male">Male</label>
          <input type="radio" id="male" name="gender" value="male">
        </span>
        <span>
          <label for="female">Female</label>
          <input type="radio" id="female" name="gender" value="female">
        </span>
        <span>
          <label for="others">Others</label>
          <input type="radio" id="others" name="gender" value="others">
        </span>
      </div>
      <div class="form-group">
        <label for="dob">Date of Birth</label>
        <input type="date" id="dob" name="dob">
      </div>
      <div class="form-group">
        <label for="address">Address</label>
        <textarea id="address" name="address" placeholder="Enter Address" cols="40" rows="2"></textarea>
      </div>
      <fieldset class="form-group">
        <legend>Language Known</legend>
        <span>
          <label for="hindi">Hindi</label>
          <input type="checkbox" id="hindi" name="hindi" value="hindi">
        </span>
        <span>
          <label for="telugu">Telugu</label>
          <input type="checkbox" id="telugu" name="telugu" value="telugu">
        </span>
        <span>
          <label for="english">English</label>
          <input type="checkbox" id="english" name="english" value="english">
        </span>
        <span>
          <label for="tamil">Tamil</label>
          <input type="checkbox" id="tamil" name="tamil" value="tamil">
        </span>
      </fieldset>
      <div class="form-group">
        <label for="termcondition">I agree to Term and Condition</label>
        <input type="checkbox" id="termcondition" name="termandcondition">
      </div>
      <button onclick="validateForm()">Submit</button>

    </section>
  </main>
</body>
<script src="validjs.js"></script>

</html>
